name: Examples Smoke Tests (Scheduled)

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r snippets/examples/requirements.txt
      - name: Run examples (smoke)
        run: |
          python snippets/examples/data_analysis_example.py
          python snippets/examples/figure_example.py
          python snippets/examples/latex_table_example.py
