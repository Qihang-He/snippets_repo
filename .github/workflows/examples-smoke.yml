name: Examples Smoke Tests

on:
  push:
    paths:
      - 'snippets/examples/**'
  pull_request:
    paths:
      - 'snippets/examples/**'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r snippets/examples/requirements.txt
      - name: Install dev dependencies (for tests)
        run: |
          pip install -r snippets/examples/requirements-dev.txt
      - name: Run tests
        run: |
          python -m pytest -q
      - name: Run examples (smoke)
        run: |
          python snippets/examples/data_analysis_example.py
          python snippets/examples/figure_example.py
          python snippets/examples/latex_table_example.py
