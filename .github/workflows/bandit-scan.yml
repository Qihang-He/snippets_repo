name: Bandit Security Scan

on:
  push:
    paths:
      - '.agents/skills/**'
  pull_request:
    paths:
      - '.agents/skills/**'

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Run bandit scan
        run: |
          bandit -r .agents/skills -f json -o bandit-report.json || true
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
